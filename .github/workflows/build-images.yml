name: build-images

# Construye y publica las imágenes Docker de la aplicación en GitHub Container
# Registry (ghcr.io). Se ejecuta al hacer push a main, al crear un tag vX.Y.Z,
# o manualmente desde la pestaña Actions.
#
# El backend (pesado por los modelos de IA) se compila solo para arm64, que es
# la única arquitectura donde se despliega (VM Oracle Ampere A1). El frontend
# se compila para amd64+arm64 por si se levanta localmente en otra arquitectura.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'validation/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            platforms: linux/arm64
            build_args: |
              ENABLE_TRANSLATION_CLASSIFIER=true
          - name: frontend
            context: ./frontend
            platforms: linux/amd64,linux/arm64
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-build ARM)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build y push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
